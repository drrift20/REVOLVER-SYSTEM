name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Verify CLI entry point
        run: |
          revolver --help

      - name: Run offline test suite (pytest)
        run: |
          pytest -v

      - name: Run built-in self-test command
        run: |
          revolver test

  test-minimal:
    name: Minimal Core Install (No Optional Extras)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install core dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify core imports and CLI
        run: |
          revolver --help
          python -c "import revolver; import revolver_system; print('Core imports OK')"

      - name: Run offline unit tests (unittest with graceful optional skips)
        run: |
          python -m unittest test_revolver.py -v
